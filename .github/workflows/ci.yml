name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sh scripts/install-cpu-deps.sh
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest
      - run: python -m src.evaluation.evaluate_adversarial_retrieval --report-path /tmp/adversarial_retrieval.md
      - run: make demo
        env:
          EVAL_OUTPUT_PATH: /tmp/evaluation/results.json
      - name: Export review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: review-snapshot
          path: .
          if-no-files-found: error
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  browser:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.production.txt
      - name: Install backend runtime
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.production.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Upload Playwright browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
