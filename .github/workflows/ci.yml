name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: docker compose config --quiet
      - run: sh scripts/install-cpu-deps.sh
      - name: Block ALL Python production dependency advisories (zero exceptions)
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --requirement requirements.production.txt --progress-spinner off
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest
      - run: python -m src.evaluation.evaluate_adversarial_retrieval --report-path /tmp/adversarial_retrieval.md
      - run: make demo
        env:
          EVAL_OUTPUT_PATH: /tmp/evaluation/results.json
      - name: Export bounded deterministic evaluation evidence
        uses: actions/upload-artifact@v6
        with:
          name: deterministic-review-evidence
          path: |
            /tmp/evaluation/results.json
            /tmp/evaluation/summary.md
            /tmp/evaluation/confusion_matrix.json
            /tmp/adversarial_retrieval.md
          if-no-files-found: error
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  browser:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.production.txt
      - name: Install backend runtime
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.production.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Functional browser regression
        run: npx playwright test e2e/triage.spec.ts e2e/evaluation.spec.ts e2e/error-state.spec.ts
      - run: npm run test:e2e
      - name: Storybook component WCAG A/AA regression
        run: npm run test:storybook:a11y
      - name: Upload Slice E visual review captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slice-e-review-screenshots
          path: frontend/review-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Playwright browser evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build API container
        run: docker build --file Dockerfile.api --tag resolveops-api:smoke .
      - name: Verify non-root identity and cache permissions
        run: |
          docker run --rm --entrypoint sh resolveops-api:smoke -c '
            test "$(id -u)" = "10001"
            test -w /app/.cache/llm
            test -w "$HOME/.cache"
          '
      - name: Smoke test isolated API with read-only fixture mounts
        run: |
          docker run --detach --name resolveops-api-smoke \
            --publish 127.0.0.1:18080:8000 \
            --volume "$PWD/data:/app/data:ro" \
            --volume "$PWD/reports:/app/reports:ro" \
            --env APP_ENV=production \
            --env DEMO_MODE=true \
            --env MOCK_LLM_MODE=true \
            --env QDRANT_MODE=memory \
            --env EMBEDDING_PROVIDER=hashing \
            resolveops-api:smoke
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          with urllib.request.urlopen(base + "/ready", timeout=5) as response:
              ready = json.load(response)
              assert response.status == 200
              assert ready["index"]["records"] == 27

          request = urllib.request.Request(
              base + "/triage",
              data=json.dumps(
                  {"message": "My card has not arrived", "top_k": 5}
              ).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
              assert response.status == 200
              assert len(result["trace"]) == 7
              assert result["provider_used"] == "mock"

          blocked = urllib.request.Request(
              base + "/ingest",
              data=b'{"sample_size": 10}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(blocked, timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError("Public ingestion unexpectedly succeeded")
          PY
      - name: Inspect container failure
        if: failure()
        run: docker logs resolveops-api-smoke || true
      - name: Stop isolated container
        if: always()
        run: docker rm --force resolveops-api-smoke || true

  space-onnx-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build actual Hugging Face ONNX release recipe (no deploy)
        run: docker build --file Dockerfile.hf --tag resolveops-space-onnx:review .
      - name: Assert installed image boundary and non-root runtime
        run: |
          docker run --rm --entrypoint python resolveops-space-onnx:review -c '
          import os
          from importlib import util
          from importlib.metadata import version
          assert os.getuid() == 1000
          assert os.getenv("EMBEDDING_PROVIDER") == "onnx"
          assert os.getenv("APP_ENV") == "production"
          assert os.getenv("DEMO_MODE") == "true"
          assert os.getenv("ALLOW_PUBLIC_INGEST") == "false"
          assert util.find_spec("fastembed") is None
          assert util.find_spec("PIL") is None
          print("ONNX", version("onnxruntime"), "without FastEmbed or Pillow")
          '
          docker run --rm --entrypoint python resolveops-space-onnx:review -m pip check
      - name: Run pinned ONNX model and seven-node synthetic API smoke
        run: |
          docker run -d --name resolveops-space-onnx-smoke \
            --publish 127.0.0.1:17860:7860 \
            resolveops-space-onnx:review
          ready=0
          for attempt in $(seq 1 180); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:17860/ready > /tmp/onnx-ready.json; then
              ready=1
              break
            fi
            if ! test "$(docker inspect -f '{{.State.Running}}' resolveops-space-onnx-smoke)" = true; then
              echo "Release image terminated before /ready"
              exit 1
            fi
            sleep 3
          done
          test "$ready" = 1
          python scripts/verify_local_onnx.py
      - name: Show bounded image logs on failure
        if: failure()
        run: docker logs --tail 120 resolveops-space-onnx-smoke || true
      - name: Cleanup isolated ONNX container
        if: always()
        run: docker rm --force resolveops-space-onnx-smoke || true
