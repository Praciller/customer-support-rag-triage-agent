name: Temporary approved Slice E snapshot refresh

on:
  push:
    branches:
      - codex/resolveops-v3-slice-e-trace-evaluation-20261023

permissions:
  contents: write

jobs:
  refresh-windows-baselines:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.production.txt
      - name: Install backend runtime
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.production.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Update owner-approved visual snapshots on Windows Chromium
        run: npx playwright test e2e/visual.spec.ts --update-snapshots --workers=1
      - name: Confirm all browser tests against new baselines
        run: npm run test:e2e
      - name: Commit only four approved screenshot binary files
        shell: pwsh
        run: |
          $allowed = @(
            "frontend/e2e/visual.spec.ts-snapshots/evaluation-desktop-chromium-win32.png",
            "frontend/e2e/visual.spec.ts-snapshots/triage-escalated-desktop-chromium-win32.png",
            "frontend/e2e/visual.spec.ts-snapshots/triage-success-desktop-chromium-win32.png",
            "frontend/e2e/visual.spec.ts-snapshots/triage-success-mobile-390-chromium-win32.png"
          )
          $actual = @(git -C .. diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw "git diff failed" }
          $disallowed = @($actual | Where-Object { $_ -notin $allowed })
          if ($disallowed.Count -gt 0) { throw "Disallowed file changes: $($disallowed -join ', ')" }
          if ($actual.Count -ne 4) { throw "Expected 4 updated screenshots, got $($actual.Count): $($actual -join ', ')" }
          if (@($allowed | Where-Object { $_ -notin $actual }).Count -gt 0) { throw "Missing approved screenshot update" }
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          foreach ($path in $allowed) { git -C .. add -- $path }
          git -C .. commit -m "test(ui): approve reviewed Slice E Windows screenshot baselines"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git -C .. push origin "HEAD:refs/heads/codex/resolveops-v3-slice-e-trace-evaluation-20261023"
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
