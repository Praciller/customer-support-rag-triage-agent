name: Temporary frontend security remediation probe

on:
  push:
    branches:
      - codex/security-dependency-remediation-20261023

permissions:
  contents: read

jobs:
  dependency-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Patch compatible locked dependencies
        run: |
          npm update storybook @storybook/react-vite @storybook/addon-a11y vite vitest
          npm audit fix --package-lock-only || true
          npm ci
      - name: Test patched dependencies
        run: |
          npm run lint
          npm test
          npm run build
          npm run build-storybook
      - name: Record remaining advisories without suppressing them
        if: always()
        run: |
          npm audit --json > dependency-audit.json || true
          npm ls tailwindcss --depth=0 > dependency-versions.txt 2>&1 || true
          npm ls storybook vite vitest --depth=0 >> dependency-versions.txt 2>&1 || true
      - name: Export reproducible lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-compatible-remediation-candidate
          path: |
            frontend/package-lock.json
            frontend/package.json
            frontend/dependency-audit.json
            frontend/dependency-versions.txt
          if-no-files-found: error
          retention-days: 7
