name: Temporary frontend security remediation probe

on:
  push:
    branches:
      - codex/security-dependency-remediation-20261023

permissions:
  contents: write

jobs:
  dependency-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Patch compatible locked dependencies
        run: |
          npm update storybook @storybook/react-vite @storybook/addon-a11y vite vitest
          npm audit fix --package-lock-only || true
          npm ci
      - name: Test patched dependencies
        run: |
          npm run lint
          npm test
          npm run build
          npm run build-storybook
      - name: Record remaining advisories without suppressing them
        if: always()
        run: |
          npm audit --json > dependency-audit.json || true
          npm ls tailwindcss --depth=0 > dependency-versions.txt 2>&1 || true
          npm ls storybook vite vitest --depth=0 >> dependency-versions.txt 2>&1 || true
      - name: Verify bounded remediation and commit only lockfile to review branch
        if: success()
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("dependency-audit.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const counts = result.metadata?.vulnerabilities;
            if (!counts || counts.critical > 0 || counts.total > 7) process.exit(1);
            if (lock.packages["node_modules/tailwindcss"]?.version !== "3.4.19") process.exit(1);
            for (const name of ["storybook", "vite", "vitest"]) {
              if (!lock.packages[`node_modules/${name}`]?.version) process.exit(1);
            }
          '
          if ! git diff --quiet -- package.json; then
            echo "Unsafe package manifest drift - review manually instead."
            exit 1
          fi
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): patch compatible frontend lockfile dependencies"
            git push origin "HEAD:refs/heads/codex/security-dependency-remediation-20261023"
          fi
      - name: Export reproducible lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-compatible-remediation-candidate
          path: |
            frontend/package-lock.json
            frontend/package.json
            frontend/dependency-audit.json
            frontend/dependency-versions.txt
          if-no-files-found: error
          retention-days: 7
